name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://stellar-institute-frontend.vercel.app/api

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.CPANEL_PORT }} ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts

      - name: Sync compiled assets
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.CPANEL_PORT }}" dist/assets/ ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:public_html/assets/

      - name: Sync API backend files
        run: |
          rsync -avz -e "ssh -p ${{ secrets.CPANEL_PORT }}" api/ ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:public_html/api/

      - name: Sync site root files
        run: |
          rsync -avz -e "ssh -p ${{ secrets.CPANEL_PORT }}" --exclude='assets' dist/ ${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}:public_html/
